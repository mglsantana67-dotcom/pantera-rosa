<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pong — Jogue agora</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    min-height: 100vh;
    background: radial-gradient(ellipse at top, #1a1f3a 0%, #0a0e1f 55%, #05070f 100%);
    font-family: 'Segoe UI', Arial, sans-serif;
    color: #fff;
    padding: 130px 20px 80px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  header {
    text-align: center;
    margin-bottom: 24px;
  }

  header h1 {
    font-size: 2.2rem;
    font-weight: 700;
  }

  header h1 span {
    background: linear-gradient(90deg, #7c8cff, #a78bfa);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  header p {
    margin-top: 10px;
    color: #8b93b8;
    font-size: 0.9rem;
  }

  #game-hud {
    color: #D8B4FE;
    font-weight: 700;
    margin-bottom: 14px;
    font-size: 0.95rem;
  }

  #game-container canvas {
    background: #050816;
    border: 1px solid rgba(168,85,247,0.35);
    border-radius: 12px;
    box-shadow: 0 16px 40px rgba(124,58,237,0.25);
    max-width: 100%;
  }
</style>

<style>
.site-nav{
  position:fixed;top:18px;left:50%;transform:translateX(-50%);
  z-index:9999;display:flex;align-items:center;gap:6px;padding:8px;
  border:1px solid rgba(168,85,247,.25);border-radius:18px;
  background:rgba(5,8,22,.82);backdrop-filter:blur(14px);
  box-shadow:0 12px 35px rgba(0,0,0,.35);
}
.site-nav a{
  color:#cbd5e1;text-decoration:none;font:600 13px/1 Arial,sans-serif;
  padding:10px 14px;border-radius:12px;transition:.2s ease;
}
.site-nav a:hover,.site-nav a.active{
  color:#fff;background:linear-gradient(90deg,#7C3AED,#A855F7);
  box-shadow:0 0 18px rgba(124,58,237,.45);
}
.home-btn{
  position:fixed;right:22px;bottom:22px;z-index:9999;
  color:#fff;text-decoration:none;font:700 13px/1 Arial,sans-serif;
  padding:12px 16px;border-radius:14px;background:linear-gradient(90deg,#7C3AED,#A855F7);
  border:1px solid rgba(255,255,255,.16);
  box-shadow:0 10px 25px rgba(124,58,237,.35);transition:.2s ease;
}
.home-btn:hover{transform:translateY(-3px);filter:brightness(1.08)}
@media(max-width:700px){
  .site-nav{width:calc(100% - 20px);justify-content:center;flex-wrap:wrap;top:10px}
  .site-nav a{padding:8px 9px;font-size:11px}
  .home-btn{right:12px;bottom:12px;padding:10px 12px}
}
</style>
</head>
<body>
<nav class="site-nav" aria-label="Navegação principal">
  <a href="index.html">Início</a>
  <a href="historia.html">História</a>
  <a href="linhadotempo.html">Linha do tempo</a>
  <a href="games.html">Games</a>
  <a href="console.html">Console</a>
  <a href="jogo.html" class="active">Jogo</a>
</nav>
<a class="home-btn" href="index.html">← Voltar para o início</a>

<header>
  <h1><span>Pong</span></h1>
  <p>Use as setas ↑ e ↓ para mover sua raquete.</p>
</header>

<div id="game-hud"></div>
<div id="game-container"></div>

<script>
  function startPong(container) {
    container.innerHTML = '<canvas id="pong-canvas" width="600" height="400"></canvas>';
    const canvas = document.getElementById('pong-canvas');
    const ctx = canvas.getContext('2d');
    const paddleW = 10, paddleH = 80;
    let playerY = 160, aiY = 160;
    let ballX = 300, ballY = 200, ballVX = 4, ballVY = 3;
    let playerScore = 0, aiScore = 0;
    const hud = document.getElementById('game-hud');

    function updateHud() { hud.textContent = `Você: ${playerScore}  |  CPU: ${aiScore}`; }
    updateHud();

    let upPressed = false, downPressed = false;
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowUp') { upPressed = true; e.preventDefault(); }
      if (e.key === 'ArrowDown') { downPressed = true; e.preventDefault(); }
    });
    document.addEventListener('keyup', (e) => {
      if (e.key === 'ArrowUp') upPressed = false;
      if (e.key === 'ArrowDown') downPressed = false;
    });

    function resetBall() {
      ballX = canvas.width / 2; ballY = canvas.height / 2;
      ballVX = (Math.random() > 0.5 ? 1 : -1) * 4;
      ballVY = (Math.random() * 2 - 1) * 3;
    }

    function loop() {
      if (upPressed) playerY -= 6;
      if (downPressed) playerY += 6;
      playerY = Math.max(0, Math.min(canvas.height - paddleH, playerY));

      const aiCenter = aiY + paddleH / 2;
      if (aiCenter < ballY - 10) aiY += 4;
      else if (aiCenter > ballY + 10) aiY -= 4;
      aiY = Math.max(0, Math.min(canvas.height - paddleH, aiY));

      ballX += ballVX;
      ballY += ballVY;
      if (ballY <= 0 || ballY >= canvas.height) ballVY *= -1;

      if (ballX <= 20 && ballX >= 10 && ballY > playerY && ballY < playerY + paddleH) {
        ballVX = Math.abs(ballVX) * 1.03;
        ballX = 20;
      }
      if (ballX >= canvas.width - 20 && ballX <= canvas.width - 10 && ballY > aiY && ballY < aiY + paddleH) {
        ballVX = -Math.abs(ballVX) * 1.03;
        ballX = canvas.width - 20;
      }

      if (ballX < 0) { aiScore++; resetBall(); }
      if (ballX > canvas.width) { playerScore++; resetBall(); }

      updateHud();

      ctx.fillStyle = '#050816';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.strokeStyle = 'rgba(168,85,247,0.3)';
      ctx.setLineDash([8, 8]);
      ctx.beginPath();
      ctx.moveTo(canvas.width / 2, 0);
      ctx.lineTo(canvas.width / 2, canvas.height);
      ctx.stroke();
      ctx.setLineDash([]);

      ctx.fillStyle = '#A855F7';
      ctx.fillRect(10, playerY, paddleW, paddleH);
      ctx.fillStyle = '#7C3AED';
      ctx.fillRect(canvas.width - 20, aiY, paddleW, paddleH);

      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(ballX, ballY, 7, 0, Math.PI * 2);
      ctx.fill();

      requestAnimationFrame(loop);
    }
    loop();
  }

  startPong(document.getElementById('game-container'));
</script>
</body>
</html>
